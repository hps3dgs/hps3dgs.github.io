  - generic [ref=e50]:
    - heading "Abstract" [level=2] [ref=e51]
    - paragraph [ref=e53]: "While 3D Gaussian Splatting (3DGS) has revolutionized real-time photorealistic rendering, its unstructured and discrete nature introduces critical storage and telemetry limitations for robotic and spaceborne perception platforms. Existing 3DGS compression methods are predominantly driven by signal-level redundancy, while explicit sharing of repeated component structures offers an additional route to compression for aerospace objects. To explicitly capitalize on these industrial priors, we propose hierarchical prototype sharing for 3DGS compression, in which the compression paradigm is shifted toward semantic-level structural reassembly. Specifically, a geometry layer condenses repetitive structures into compact meta templates via a coarse-to-fine cascade: spectral divergence pruning, robust rigid alignment, and alternating differentiable refinement. Subsequently, an appearance layer exploits material sparsity through component-wise vector quantization. Extensive evaluations across diverse aerospace scenarios, including high-fidelity synthetic models and real-world mock-ups, demonstrate that our method effectively copes with the rate-distortion bottlenecks of current compression paradigms. It reduces the explicit 3D representation to approximately 0.7 MB, achieving a storage compression ratio of at least 15× while maintaining high-fidelity visual quality above 39 dB. By combining structural sharing with appearance encoding, our method preserves structural integrity and delivers a memory-efficient 3D representation for bandwidth-constrained autonomous perception."
